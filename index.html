<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Revision Adventure · MYP</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f8ff;color:#26314a}header{background:#fff;padding:18px 5%;border-bottom:1px solid #e4e8f5;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;font-size:21px;color:#5641b7}.small{font-size:13px;color:#647089}.shell{max-width:1050px;margin:auto;padding:26px 20px 90px}.hero{background:linear-gradient(125deg,#6152c8,#8b78e5);border-radius:24px;color:white;padding:32px;margin-bottom:22px}.hero h1{font-size:clamp(26px,4vw,39px);margin:0 0 8px}.hero p{margin:0;opacity:.93}.crumb{color:#5b6480;margin-bottom:18px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:15px}.card{background:white;border:1px solid #e5e8f4;border-radius:20px;padding:22px;box-shadow:0 6px 20px #26314a09}.pick{cursor:pointer;text-align:left;transition:.15s;min-height:130px}.pick:hover{transform:translateY(-2px);border-color:#8472db}.pick h3{margin:8px 0}.icon{font-size:32px}.muted{color:#66718a}.tag{display:inline-block;background:#eeeafd;color:#5641b7;border-radius:30px;padding:5px 11px;font-size:12px;font-weight:750;margin:3px 5px 3px 0}.button,button{font:inherit}button{cursor:pointer}.button{border:0;background:#6252c7;color:white;border-radius:13px;padding:12px 19px;font-weight:750}.secondary{background:#efecff;color:#5542b5}.outline{background:white;border:1px solid #dadcf0;color:#5142a8}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.question{font-size:22px;line-height:1.5;font-weight:750;margin:18px 0}.answer{width:100%;min-height:145px;border:2px solid #e0e3f2;border-radius:14px;padding:15px;font:inherit;resize:vertical}.answer:focus{outline:2px solid #8476db}.feedback{background:#eef8f3;border-radius:15px;padding:17px;margin:14px 0;white-space:pre-wrap}.hint{background:#fff5dc}.progress{height:12px;background:#e6e6f2;border-radius:15px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#6bc8a6}.options{display:grid;gap:10px}.option{border:2px solid #e6e6f2;background:white;text-align:left;padding:13px;border-radius:12px}.option:focus,.option:hover{border-color:#7c6cda}.correct{border-color:#2e9d76;background:#e6f7ef}.incorrect{border-color:#df7a7a;background:#fff0f0}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.nav{margin-top:20px;display:flex;justify-content:space-between;gap:12px}.command{font-weight:850;color:#5641b7}.summary{background:#fff;padding:15px;border-radius:15px;margin-top:15px}.divider{border-top:1px solid #e8eaf3;margin:22px 0}.subtle{font-size:13px;color:#65718b}.chip{padding:8px 12px;background:#f3f1ff;border-radius:10px;display:inline-block;margin:4px}.big{font-size:28px;font-weight:800}.diagram{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.node{background:#f0edff;border-radius:13px;padding:13px;min-width:140px}.node select{width:100%;margin-top:8px;padding:7px;border-radius:7px;border:1px solid #bbb}.timer{font-size:30px;font-weight:850;color:#5844bd}@media(max-width:550px){.shell{padding:17px 12px 60px}.hero{padding:24px}.card{padding:17px}.question{font-size:19px}}</style></head><body><header><div class="brand">✦ My Revision Adventure</div><div class="small">MYP · Science · Criterion A</div></header><main class="shell"><div id="app"></div></main><script>const DATA=[{"topic": "Biomolecules", "strand": "i", "term": "Describe", "q": "Describe the roles of carbohydrates, fats and proteins in living organisms. Give one example of each.", "answer": "Carbohydrates supply readily available energy and can store energy as starch; fats store energy over longer periods and insulate; proteins have structural and functional roles, including keratin and enzymes.", "hint": "Include function AND a concrete example.", "level": "Challenge"}, {"topic": "Biomolecules", "strand": "ii", "term": "Apply", "q": "A seal survives in icy water. Explain how its adipose tissue helps it survive.", "answer": "Adipose tissue stores fat under the skin, providing thermal insulation that reduces heat loss; it also stores chemical energy.", "hint": "Link structure to function.", "level": "Challenge"}, {"topic": "Biomolecules", "strand": "iii", "term": "Evaluate", "q": "A student claims: “All fats are harmful and have no useful function.” Evaluate the claim using scientific evidence.", "answer": "The claim is incorrect: fats store energy, insulate animals such as seals and are components of living systems. Excess consumption can cause problems, but that does not mean fats have no useful role.", "hint": "Identify the claim, counter-evidence, and judgement.", "level": "Challenge"}, {"topic": "Biomolecules", "strand": "i", "term": "Outline", "q": "Outline the difference between an element and a compound, using carbon and water as examples.", "answer": "An element consists of one type of atom, e.g. carbon (C); a compound contains chemically combined elements, e.g. water (H₂O) has hydrogen and oxygen.", "hint": "Use symbols and formulae accurately.", "level": "Challenge"}, {"topic": "Biomolecules", "strand": "i", "term": "Identify", "q": "Identify the four main biomolecule groups and the two main micronutrient categories mentioned in the booklet.", "answer": "Carbohydrates, fats (lipids), proteins, nucleic acids; vitamins and minerals.", "hint": "Nucleic acids include DNA and RNA.", "level": "Challenge"}, {"topic": "Cells and organisation", "strand": "i", "term": "Describe", "q": "Describe the roles of the cell membrane, cytoplasm, mitochondria, nucleus and cell wall.", "answer": "Membrane encloses the cell and controls exchange; cytoplasm contains cell components; mitochondria are sites of aerobic respiration/ATP production; nucleus contains DNA in eukaryotic cells; plant cell walls provide rigid support.", "hint": "Distinguish plant-specific and eukaryotic features.", "level": "Challenge"}, {"topic": "Cells and organisation", "strand": "ii", "term": "Compare", "q": "Compare prokaryotic and eukaryotic cells, including genetic material.", "answer": "Both have a membrane, cytoplasm and genetic material. Prokaryotes have no membrane-bound nucleus and their DNA is in a nucleoid region; eukaryotes have a nucleus and membrane-bound organelles.", "hint": "Mention a similarity and at least two differences.", "level": "Challenge"}, {"topic": "Cells and organisation", "strand": "i", "term": "Sequence", "q": "Arrange these from smallest to largest: organ, organism, cell, system, tissue. Explain the relationship.", "answer": "Cell → tissue → organ → organ system → organism. Similar cells form tissues, tissues form organs, organs work in systems, and systems together form an organism.", "hint": "Explain, do not just list.", "level": "Challenge"}, {"topic": "Cells and organisation", "strand": "iii", "term": "Analyse", "q": "A sample has DNA, ribosomes and a membrane, but no nucleus. Analyse which cell type it is most likely to be.", "answer": "It is most likely prokaryotic because it has essential cell structures but lacks a membrane-bound nucleus. The evidence is consistent with a bacterium or archaeon; absence of a visible nucleus alone is not absolute proof.", "hint": "Use the evidence and acknowledge uncertainty.", "level": "Challenge"}, {"topic": "Classification and life", "strand": "i", "term": "State", "q": "State the three domains of life and identify the domain containing animals and plants.", "answer": "Bacteria, Archaea and Eukarya; plants and animals are in Eukarya.", "hint": "Use domain names precisely.", "level": "Challenge"}, {"topic": "Classification and life", "strand": "iii", "term": "Explain", "q": "Explain why classification systems may change as scientists make new discoveries.", "answer": "New evidence, including genetic comparisons, can reveal previously unknown evolutionary relationships, requiring scientists to revise groups and classifications.", "hint": "Connect evidence to scientific revision.", "level": "Challenge"}, {"topic": "Classification and life", "strand": "ii", "term": "Apply", "q": "An organism has cells with nuclei and produces its own food by photosynthesis. Identify its likely domain and justify your answer.", "answer": "Eukarya, because cells with nuclei are eukaryotic; it may be a plant or alga. Photosynthesis alone does not uniquely determine its kingdom.", "hint": "Avoid overclaiming from limited evidence.", "level": "Challenge"}, {"topic": "Vital functions", "strand": "i", "term": "Describe", "q": "Describe the three vital functions of living things and give an example of each.", "answer": "Nutrition: obtaining/using matter and energy, e.g. eating or photosynthesis. Interaction: responding to stimuli, e.g. sunflower responding to light. Reproduction: producing offspring, e.g. bacterial cell division.", "hint": "Three definitions and three examples.", "level": "Challenge"}, {"topic": "Vital functions", "strand": "ii", "term": "Explain", "q": "A sunflower bends toward a window. Explain which vital function this demonstrates and why.", "answer": "Interaction: the plant responds to the environmental stimulus of directional light by changing its growth direction.", "hint": "Name stimulus and response.", "level": "Challenge"}, {"topic": "Nutrition and photosynthesis", "strand": "i", "term": "Compare", "q": "Compare autotrophs and heterotrophs and give two examples of each.", "answer": "Autotrophs produce organic food from inorganic substances using an energy source, e.g. plants and algae; heterotrophs obtain organic matter by consuming other organisms or their products, e.g. zebra and lion.", "hint": "Use food source as your comparison.", "level": "Challenge"}, {"topic": "Nutrition and photosynthesis", "strand": "i", "term": "State", "q": "State the inputs and outputs of photosynthesis.", "answer": "Carbon dioxide and water are used with light energy to produce glucose and oxygen.", "hint": "Do not confuse photosynthesis with respiration.", "level": "Challenge"}, {"topic": "Nutrition and photosynthesis", "strand": "ii", "term": "Explain", "q": "Explain why removing most producers from an ecosystem would affect herbivores and carnivores.", "answer": "Producers form the base of many food chains and convert light energy into chemical energy. Herbivores lose food and their populations may decline, reducing food for carnivores.", "hint": "Explain the chain of consequences.", "level": "Challenge"}, {"topic": "Nutrition and photosynthesis", "strand": "iii", "term": "Evaluate", "q": "A classmate says: “Plants only photosynthesise; they do not respire.” Evaluate this statement.", "answer": "Incorrect. Plants photosynthesise when light is available and also respire to release usable energy from organic molecules. Respiration occurs in plant cells day and night.", "hint": "State judgement with scientific reasoning.", "level": "Challenge"}, {"topic": "Digestion and absorption", "strand": "i", "term": "Sequence", "q": "Describe the route food follows through the digestive tract, from mouth to anus.", "answer": "Mouth → pharynx → oesophagus → stomach → small intestine → large intestine → rectum → anus. The booklet explicitly mentions most of these; rectum completes the anatomical route.", "hint": "Include the major organs in order.", "level": "Challenge"}, {"topic": "Digestion and absorption", "strand": "i", "term": "Explain", "q": "Explain what happens in the mouth, stomach and small intestine during digestion.", "answer": "Mouth: chewing and saliva begin food breakdown; stomach: gastric juices and muscular mixing continue digestion; small intestine: pancreatic and intestinal juices plus bile support digestion, followed by nutrient absorption.", "hint": "Separate mechanical and chemical processes.", "level": "Challenge"}, {"topic": "Digestion and absorption", "strand": "ii", "term": "Predict", "q": "Predict how nutrient absorption would change if the small intestine had very few villi. Explain.", "answer": "Absorption would be less efficient because fewer villi mean a smaller surface area for digested nutrients to cross into blood or lymph, potentially causing nutrient deficiencies.", "hint": "Link surface area to rate of absorption.", "level": "Challenge"}, {"topic": "Digestion and absorption", "strand": "iii", "term": "Analyse", "q": "A patient has damage to the lining of the small intestine and loses weight despite eating normally. Analyse a possible explanation.", "answer": "Damage to villi reduces absorptive surface area, so fewer nutrients are absorbed. This can lead to malnutrition and weight loss despite adequate food intake; other causes are possible.", "hint": "Make a reasoned link, not a diagnosis.", "level": "Challenge"}, {"topic": "Digestion and absorption", "strand": "ii", "term": "Explain", "q": "Explain why prolonged severe diarrhoea can become dangerous.", "answer": "Rapid loss of water and electrolytes can cause dehydration and electrolyte imbalance, impairing organ function and potentially becoming life-threatening.", "hint": "Explain the mechanism.", "level": "Challenge"}, {"topic": "Reproduction", "strand": "i", "term": "Compare", "q": "Compare asexual and sexual reproduction in terms of parents and genetic contribution.", "answer": "Asexual reproduction normally involves one parent and offspring receiving genetic material from that parent. Sexual reproduction involves fusion of gametes, normally contributing genetic material from two parents.", "hint": "Distinguish genetic contribution from number of organisms present.", "level": "Challenge"}, {"topic": "Reproduction", "strand": "ii", "term": "Explain", "q": "Explain how pollination in flowering plants differs from the transfer of gametes in human reproduction.", "answer": "Pollen must reach the stigma of a compatible flower, often assisted by wind or animals. In humans, sperm are transferred within the reproductive system; fertilisation follows when sperm and egg unite.", "hint": "Distinguish pollination from fertilisation.", "level": "Challenge"}, {"topic": "Reproduction", "strand": "iii", "term": "Evaluate", "q": "A student says: “Every flower needs a bee to reproduce.” Evaluate the statement.", "answer": "Incorrect. Many flowering plants are pollinated by insects, but others use wind, water or other animals, and some can self-pollinate. Pollination method varies by species.", "hint": "Give counterexamples and a balanced conclusion.", "level": "Challenge"}, {"topic": "Mixed exam practice", "strand": "iii", "term": "Analyse", "q": "A diagram shows a plant cell with a rigid outer layer and a nucleus. Analyse what these structures reveal about the cell.", "answer": "A rigid cell wall supports and protects the cell; a nucleus indicates it is eukaryotic. These features are consistent with a plant cell, although other eukaryotes may also have walls.", "hint": "Make evidence-based inferences.", "level": "Challenge"}, {"topic": "Mixed exam practice", "strand": "ii", "term": "Apply", "q": "A student eats bread and then runs. Explain how nutrients from the bread can support muscular activity.", "answer": "Starch is digested into sugars such as glucose, absorbed through the small intestine into the bloodstream, transported to cells and used in cellular respiration to provide ATP for muscle contraction.", "hint": "Connect digestion, absorption and respiration.", "level": "Challenge"}, {"topic": "Mixed exam practice", "strand": "iii", "term": "Evaluate", "q": "A student argues: “A shorter intestine must always digest food faster and therefore is healthier.” Evaluate the argument.", "answer": "Unsupported. Digestion and absorption are different processes; reduced small-intestinal length generally reduces surface area and time available for nutrient absorption, which can cause deficiencies. Health cannot be inferred from speed alone.", "hint": "Challenge the assumption and use evidence.", "level": "Challenge"}, {"topic": "Mixed exam practice", "strand": "iii", "term": "Analyse", "q": "A diagram of a food chain shows grass → zebra → lion. Analyse the consequences if a drought greatly reduces grass growth.", "answer": "Less grass reduces food and energy available to zebras, likely reducing zebra survival/reproduction; lions may then have less prey and decline or move. Outcomes depend on alternatives and ecosystem conditions.", "hint": "Trace indirect effects and note limitations.", "level": "Challenge"}];

const $=s=>document.querySelector(s), esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOPICS=[...new Set(DATA.map(x=>x.topic))];const STORE='revision-studio-progress';let progress={};try{progress=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){};function save(){try{localStorage.setItem(STORE,JSON.stringify(progress))}catch(e){}}
let screen='home',topic='All topics',mode='questions',index=0,order=[],reveal=false,timer=null,remaining=1200,started=false;
const id=x=>x.topic+'|'+x.q;const completed=()=>DATA.filter(x=>progress[id(x)]?.rating===2).length;
function frame(title,subtitle,body){$('#app').innerHTML=`<div class="crumb"><button class="button outline" onclick="goBack()">← Back</button> &nbsp; ${esc(title)}</div><div class="hero"><h1>${title}</h1><p>${subtitle}</p></div>${body}`}
function goBack(){if(timer){clearInterval(timer);timer=null}if(screen==='home')return; if(screen==='subject'){screen='home'}else if(screen==='unit'){screen='subject'}else if(screen==='menu'){screen='unit'}else{screen='menu'}render()}
function render(){if(screen==='home'){frame('Ready to become a science superstar? 🌟','Choose a subject to begin. One small step at a time.',`<div class="grid"><button class="card pick" onclick="screen='subject';render()"><div class="icon">🔬</div><h3>Science</h3><p class="muted">Living things, cells, digestion and more →</p><span class="tag">Criterion A only</span></button></div><div class="summary"><b>Your progress:</b> ${completed()} of ${DATA.length} written practice questions marked confident.<div class="progress"><div style="width:${completed()/DATA.length*100}%"></div></div><p class="subtle">Your written practice answers are saved on this device.</p></div>`);return}
if(screen==='subject'){frame('Science 🔬','Choose your unit.',`<div class="grid"><button class="card pick" onclick="screen='unit';render()"><div class="icon">🌿</div><h3>Unit 1 · Living things & body systems</h3><p class="muted">${TOPICS.length} topics · ${DATA.length} practice questions</p><span class="tag">Criterion A</span></button></div>`);return}
if(screen==='unit'){frame('Unit 1 🌿','Pick a topic, or revise everything together.',`<div class="grid"><button class="card pick" onclick="chooseTopic('All topics')"><div class="icon">🚀</div><h3>All topics</h3><p class="muted">Get ready for the whole exam →</p></button>${TOPICS.map((t,i)=>`<button class="card pick" onclick="chooseTopic(${JSON.stringify(t).replace(/"/g,'&quot;')})"><div class="icon">${['🧬','🔎','🌍','🌱','☀️','🍎','💚','🫁','🧠'][i%9]}</div><h3>${esc(t)}</h3><p class="muted">${DATA.filter(x=>x.topic===t).length} questions →</p></button>`).join('')}</div>`);return}
if(screen==='menu'){let n=DATA.filter(x=>topic==='All topics'||x.topic===topic).length;frame('Choose your practice 🎯',`${topic} · Science · Unit 1 · Criterion A`, `<div class="grid">${[['questions','✍️','Answer a question','Write your answer, then check it'],['flash','🃏','Flashcards','Think first, then flip'],['quiz','⚡','Quick quiz','Choose the best answer'],['diagram','🧩','Label & order','Put science ideas in the right place'],['challenge','🏆','Level 7–8 challenge','Apply science and justify your ideas'],['mock','⏱️','Practice exam','Timed Criterion A exam']].map(([m,e,t,d])=>`<button class="card pick" onclick="start('${m}')"><div class="icon">${e}</div><h3>${t}</h3><p class="muted">${d} →</p></button>`).join('')}</div><p class="subtle">${n} questions available in this topic. Your teacher awards official MYP levels, not this practice site.</p>`);return}
if(screen==='activity')activity();}
function chooseTopic(t){topic=t;screen='menu';render()}function start(m){mode=m;index=0;reveal=false;remaining=1200;started=false;order=DATA.filter(x=>topic==='All topics'||x.topic===topic);if(m==='challenge')order=order.filter(x=>x.strand!=='i');if(m==='mock')order=[...order.filter(x=>x.strand==='i').slice(0,2),...order.filter(x=>x.strand==='ii').slice(0,2),...order.filter(x=>x.strand==='iii').slice(0,2)];if(m==='diagram')order=[];screen='activity';render()}
const strandText={i:'Explain scientific knowledge',ii:'Apply science to solve problems',iii:'Use evidence to make scientific judgements'};
function activity(){if(mode==='diagram')return diagram();let x=order[index];if(!x){frame('No questions yet','Choose another activity.',`<button class="button" onclick="goBack()">Go back</button>`);return}let heading={questions:'Answer a question ✍️',flash:'Flashcards 🃏',quiz:'Quick quiz ⚡',challenge:'Level 7–8 challenge 🏆',mock:'Practice exam ⏱️'}[mode];let extra=mode==='mock'?`<div class="topline"><span class="timer" id="clock">${time()}</span><button class="button secondary" onclick="toggleTimer()" id="timerButton">${started?'Pause':'Start timer'}</button></div>`:'';let q=mode==='quiz'?`<p class="question">${esc(x.q)}</p><p class="muted">Choose the best answer.</p><div class="options" id="options"></div>`:`<p class="question"><span class="command">${esc(x.term)}:</span> ${esc(x.q)}</p>${mode==='flash'?'<p class="muted">Say your answer aloud before revealing it.</p>':`<textarea class="answer" id="written" placeholder="Write your answer here. Take your time!"></textarea>`}`;
frame(heading,`${topic} · Question ${index+1} of ${order.length}`,`<div class="card">${extra}<div class="topline"><span class="tag">Criterion A · Strand ${x.strand}</span><span class="subtle">${esc(x.topic)}</span></div><p class="subtle">${strandText[x.strand]} · Command term: ${esc(x.term)}</p><div class="progress"><div style="width:${(index+1)/order.length*100}%"></div></div>${q}<div class="row" style="margin-top:17px"><button class="button secondary" onclick="showHint()">💡 Give me a hint</button><button class="button" onclick="showAnswer()">${mode==='flash'?'Flip card':'Check my answer'}</button></div><div id="hint" class="feedback hint hidden"></div><div id="model" class="feedback hidden"></div><div id="rating" class="hidden"><p><b>How did you do?</b> (Your own judgement)</p><div class="row"><button class="button outline" onclick="rate(0)">🔁 Practise again</button><button class="button outline" onclick="rate(1)">🙂 Nearly there</button><button class="button" onclick="rate(2)">⭐ Got it!</button></div></div><div class="nav"><button class="button outline" ${index===0?'disabled':''} onclick="move(-1)">← Previous</button><button class="button" onclick="move(1)">${index===order.length-1?'Finish':'Next →'}</button></div></div>`);
if(mode==='quiz'){let wrong=order.filter(z=>z!==x&&z.answer!==x.answer);let opts=[x.answer,...wrong.slice((index*3)%Math.max(1,wrong.length),((index*3)%Math.max(1,wrong.length))+2).map(z=>z.answer)];if(opts.length<3)opts=[x.answer,...DATA.filter(z=>z!==x).slice(0,2).map(z=>z.answer)];opts=opts.map((v,i)=>({v,sort:(i*7+index*3)%5})).sort((a,b)=>a.sort-b.sort).map(z=>z.v);$('#options').innerHTML=opts.map(o=>`<button class="option" onclick="pick(this,${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join('');}
else if(mode!=='flash'){let el=$('#written');el.value=progress[id(x)]?.draft||'';el.oninput=()=>{progress[id(x)]={...progress[id(x)],draft:el.value};save()}}
if(reveal)showAnswer();}
function pick(el,v){let x=order[index];document.querySelectorAll('.option').forEach(o=>o.disabled=true);el.classList.add(v===x.answer?'correct':'incorrect');showAnswer()}
function showHint(){$('#hint').textContent=order[index].hint;$('#hint').classList.remove('hidden')}
function showAnswer(){reveal=true;$('#model').innerHTML=`<b>Example answer:</b><br>${esc(order[index].answer)}<p class="subtle">Check: Did you follow the command term, use accurate science, and explain your reasoning?</p>`;$('#model').classList.remove('hidden');$('#rating').classList.remove('hidden')}
function rate(n){let x=order[index];progress[id(x)]={...progress[id(x)],rating:n};save();move(1)}
function move(n){if(index+n>=order.length){if(timer){clearInterval(timer);timer=null}screen='menu';render();return}index=Math.max(0,index+n);reveal=false;activity()}
function time(){return `${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`}
function toggleTimer(){if(timer){clearInterval(timer);timer=null;started=false;$('#timerButton').textContent='Resume timer';return}started=true;$('#timerButton').textContent='Pause';timer=setInterval(()=>{remaining=Math.max(0,remaining-1);if($('#clock'))$('#clock').textContent=time();if(!remaining){clearInterval(timer);timer=null;alert('Time is up! Check your answers and see what to practise next.')}},1000)}
function diagram(){frame('Label & order 🧩','Science · Unit 1 · Criterion A · Strand i',`<div class="card"><h2>Put the levels of organisation in order</h2><p>Choose the correct word for each step, from smallest to largest.</p><div class="diagram">${Array.from({length:5},(_,i)=>`<div class="node">Step ${i+1}<br><select id="d${i}"><option value="">Choose…</option>${['Organ','Tissue','Cell','Organ system','Organism'].map(t=>`<option>${t}</option>`).join('')}</select></div>`).join('<b>→</b>')}</div><button class="button" onclick="checkDiagram()">Check my labels</button><div id="dresult" class="feedback hidden"></div><p class="subtle">Criterion A(i): demonstrate knowledge of scientific organisation.</p></div>`)}
function checkDiagram(){let right=['Cell','Tissue','Organ','Organ system','Organism'];let n=right.filter((x,i)=>$('#d'+i).value===x).length;$('#dresult').classList.remove('hidden');$('#dresult').textContent=`${n} of 5 correct. The correct order is: ${right.join(' → ')}.`}
render();
</script></body></html>
